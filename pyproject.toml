[project]
name = "markdown-editor"
version = "0.15.1"
description = "파일 탐색기·편집기·뷰어 세 칸 마크다운 편집기"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
mdEditor = "mdeditor.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdeditor"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "mdeditor/CHANGELOG.md"  # 프로그램 안 [도움말 → 새 기능·변경 이력]

[tool.pytest.ini_options]
testpaths = ["tests"]
