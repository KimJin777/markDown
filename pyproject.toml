[project]
name = "markdown-editor"
version = "0.5.0"
description = "파일 탐색기·편집기·뷰어 세 칸 마크다운 편집기"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.7",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
mdEditor = "mdeditor.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdeditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
